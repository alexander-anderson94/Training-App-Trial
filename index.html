<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training App</title>
<meta name="description" content="Log your training: sessions, supersets, progress, programmes and runs. Works offline.">
<meta name="theme-color" content="#14191F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a gym logbook — sticky week/day bar, then one card per exercise with tap-to-fill set rows. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#14191F; --muted:#5B6570; --line:#D9DEE4;
  --accent:#C62828; --accent-ink:#FFFFFF; --good:#2E7D4F; --good-soft:#E3F2E9; --warn:#9A6400;
  --b1:#2E6F95; --b2:#8A5A2B; --b3:#7A2E3A; --ss:#7B57D9; --ss-soft:#F1ECFC;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1215; --surface:#181D22; --sunk:#12161A; --ink:#E9EDF1; --muted:#97A2AD; --line:#2A3239;
  --accent:#EF5350; --accent-ink:#14191F; --good:#5CBF84; --good-soft:#163024; --warn:#E0A84A;
  --b1:#5FA3CC; --b2:#C48A55; --b3:#C46677; --ss:#A88BF2; --ss-soft:#221B33; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1215; --surface:#181D22; --sunk:#12161A; --ink:#E9EDF1; --muted:#97A2AD; --line:#2A3239;
  --accent:#EF5350; --accent-ink:#14191F; --good:#5CBF84; --good-soft:#163024; --warn:#E0A84A;
  --b1:#5FA3CC; --b2:#C48A55; --b3:#C46677; --ss:#A88BF2; --ss-soft:#221B33; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}

/* colour palettes: light values, then dark (system dark unless forced light, and forced dark) */
:root[data-palette="forest"]{--bg:#EDF1EE;--surface:#FFFFFF;--sunk:#F4F7F5;--line:#D5DED8;--ink:#13201B;--muted:#56655E;--accent:#1F6F5C;--accent-ink:#FFFFFF;--b1:#2C6E63;--b2:#8A6A1F;--b3:#7C3A2D;--ss:#6A4FC4;--ss-soft:#EFEBFA}
@media (prefers-color-scheme: dark){:root[data-palette="forest"]:not([data-theme="light"]){--bg:#0E1412;--surface:#16201C;--sunk:#111915;--line:#26332D;--ink:#E6EFEA;--muted:#93A69D;--accent:#4FB79A;--accent-ink:#0E1412;--b1:#5DB3A4;--b2:#D1A651;--b3:#D17A66;--ss:#A891F0;--ss-soft:#211C31}}
:root[data-palette="forest"][data-theme="dark"]{--bg:#0E1412;--surface:#16201C;--sunk:#111915;--line:#26332D;--ink:#E6EFEA;--muted:#93A69D;--accent:#4FB79A;--accent-ink:#0E1412;--b1:#5DB3A4;--b2:#D1A651;--b3:#D17A66;--ss:#A891F0;--ss-soft:#211C31}
:root[data-palette="ocean"]{--bg:#EDF2F8;--surface:#FFFFFF;--sunk:#F4F7FB;--line:#D4DDE8;--ink:#111A26;--muted:#56637A;--accent:#1F5FBF;--accent-ink:#FFFFFF;--b1:#1F5FBF;--b2:#16808F;--b3:#5B4FB3;--ss:#C2410C;--ss-soft:#FDEEE5}
@media (prefers-color-scheme: dark){:root[data-palette="ocean"]:not([data-theme="light"]){--bg:#0C121B;--surface:#141C28;--sunk:#0F1620;--line:#243042;--ink:#E6EDF6;--muted:#93A1B6;--accent:#5B9BF0;--accent-ink:#0C121B;--b1:#6EA6F2;--b2:#4FC0CF;--b3:#9A8FEA;--ss:#F08A55;--ss-soft:#2E1C12}}
:root[data-palette="ocean"][data-theme="dark"]{--bg:#0C121B;--surface:#141C28;--sunk:#0F1620;--line:#243042;--ink:#E6EDF6;--muted:#93A1B6;--accent:#5B9BF0;--accent-ink:#0C121B;--b1:#6EA6F2;--b2:#4FC0CF;--b3:#9A8FEA;--ss:#F08A55;--ss-soft:#2E1C12}
:root[data-palette="ember"]{--bg:#F6F0EB;--surface:#FFFDFB;--sunk:#FAF5F1;--line:#E5D9CF;--ink:#22170F;--muted:#6E5E52;--accent:#C2410C;--accent-ink:#FFFFFF;--b1:#A3511C;--b2:#8C2F39;--b3:#5C3D7A;--ss:#2563A6;--ss-soft:#E8F0FA}
@media (prefers-color-scheme: dark){:root[data-palette="ember"]:not([data-theme="light"]){--bg:#16110D;--surface:#201913;--sunk:#1A140F;--line:#3A2E24;--ink:#F3EAE2;--muted:#B3A294;--accent:#F07A3E;--accent-ink:#16110D;--b1:#E09A5E;--b2:#E07A86;--b3:#B49AE0;--ss:#6FA8E8;--ss-soft:#14202E}}
:root[data-palette="ember"][data-theme="dark"]{--bg:#16110D;--surface:#201913;--sunk:#1A140F;--line:#3A2E24;--ink:#F3EAE2;--muted:#B3A294;--accent:#F07A3E;--accent-ink:#16110D;--b1:#E09A5E;--b2:#E07A86;--b3:#B49AE0;--ss:#6FA8E8;--ss-soft:#14202E}
:root[data-palette="graphite"]{--bg:#F1F1F1;--surface:#FFFFFF;--sunk:#F6F6F6;--line:#DADADA;--ink:#151515;--muted:#5E5E5E;--accent:#1C1C1C;--accent-ink:#FFFFFF;--b1:#333333;--b2:#5A5A5A;--b3:#7A7A7A;--ss:#7B57D9;--ss-soft:#F1ECFC}
@media (prefers-color-scheme: dark){:root[data-palette="graphite"]:not([data-theme="light"]){--bg:#0F0F0F;--surface:#1A1A1A;--sunk:#141414;--line:#2E2E2E;--ink:#EDEDED;--muted:#9E9E9E;--accent:#EDEDED;--accent-ink:#111111;--b1:#D6D6D6;--b2:#ADADAD;--b3:#8A8A8A;--ss:#A88BF2;--ss-soft:#221B33}}
:root[data-palette="graphite"][data-theme="dark"]{--bg:#0F0F0F;--surface:#1A1A1A;--sunk:#141414;--line:#2E2E2E;--ink:#EDEDED;--muted:#9E9E9E;--accent:#EDEDED;--accent-ink:#111111;--b1:#D6D6D6;--b2:#ADADAD;--b3:#8A8A8A;--ss:#A88BF2;--ss-soft:#221B33}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.row1 .views{order:3;width:100%}
.views button{flex:1}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.st-ok i{background:var(--good)} .status.st-busy i{background:var(--warn)} .status.st-err i{background:var(--accent)}
.views{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.views button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.weekbar{display:flex;align-items:center;gap:8px}
.runline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:4px}
.runbtn{border:0;background:none;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.views button{padding:6px 8px}
.days button .sub{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow .need input,.wform .need input{border-color:var(--accent)}
.err{font-size:13px;color:var(--accent);font-weight:600}
.weekbar .nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.weekbar .nav:disabled{opacity:.35;cursor:default}
.wk{flex:1;min-width:0;text-align:center}
.wk b{display:block;font-family:var(--display);font-size:26px;line-height:1;letter-spacing:.02em}
.blkname{border:0;background:none;padding:2px 4px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blk);border-radius:6px}
.blkname svg{opacity:.7}
.wk span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blk)}
.days{display:grid;grid-template-columns:repeat(5,1fr) 44px;gap:2px;margin-bottom:-1px}
.days .dayedit{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;color:var(--muted)}
.dayrow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr;gap:8px;align-items:end;border-top:1px dashed var(--line);padding-top:10px}
.dayrow.off{opacity:.55}
.dayrow .edbtns{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.days button{border:0;border-bottom:3px solid transparent;background:none;padding:8px 0 9px;font-weight:600;color:var(--muted);position:relative}
.days button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--blk)}
.days button .tick{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--good);font-weight:600;height:13px}
.days button .opt{color:var(--muted);font-weight:500}
main .wrap{padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
.focus{font-size:14px;color:var(--muted);border-left:3px solid var(--blk);padding:2px 0 2px 10px}
.dayhead h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.card.main{border-left:4px solid var(--blk)}
.card.warm{background:var(--sunk)}
.wsteps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.nowarm{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.wform{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.wform textarea{min-height:110px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.guide .gp{margin:0;color:var(--ink)}
.guide dd .addnote{margin-left:4px;font-size:12px}
.guide textarea{min-height:160px}
.ch{display:flex;gap:10px;align-items:flex-start}
.tag{flex:none;min-width:30px;height:24px;padding:0 6px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:15px;display:grid;place-items:center}
.main .tag{background:var(--blk);border-color:var(--blk);color:var(--surface)}
.ttl{flex:1;min-width:0}
.ssbar{font-size:13px;color:var(--muted);margin:4px 0 -6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ssbar b{color:var(--ss);font-weight:700}
.card.ssc{border:2px solid var(--ss);box-shadow:inset 4px 0 0 var(--ss)}
.card.ssc .tag{background:var(--ss-soft);border-color:var(--ss);color:var(--ss)}
.ordrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.ordrow .btn{padding:8px 12px}
.ordrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{white-space:nowrap}
.ttl h3{margin:0;font-size:17px;font-weight:600;line-height:1.2}
.rx{font-size:13px;color:var(--muted);margin-top:2px}
.rx b{color:var(--ink);font-weight:600}
.sug{flex:none;text-align:right;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sug b{display:block;font-family:var(--display);font-size:22px;line-height:1;color:var(--ink);letter-spacing:0;text-transform:none}
.sug small{display:block;text-transform:none;letter-spacing:0;font-size:11px}
.note{font-size:13px;color:var(--warn);font-weight:500}
.last{font-size:12px;color:var(--muted)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center}
.sets .hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets .n{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted);text-align:center}
input.num,input.txt,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:16px}
input.num{text-align:center;font-weight:600}
input.num::placeholder{color:var(--muted);font-weight:400;opacity:.75}
textarea{resize:vertical;min-height:40px;font-size:15px}
.ok{width:44px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--muted)}
.ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.done-row input.num{background:var(--good-soft);border-color:transparent}
.e1{font-size:12px;color:var(--muted);text-align:right}
.e1 b{color:var(--ink)}
.parts{display:flex;flex-direction:column;gap:4px;font-size:14px}
.parts div{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:4px}
.parts span{color:var(--muted);white-space:nowrap}
.addnote{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.finish{border:0;border-radius:var(--r);padding:14px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.finish.is-done{background:var(--good-soft);color:var(--good)}
.section h2{font-family:var(--display);font-size:22px;margin:4px 0 0;text-transform:uppercase;letter-spacing:.02em}
.section p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
tr.blkrow td{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);text-align:left}
td input.num{padding:6px;max-width:84px}
tfoot td{font-weight:600}
.up{color:var(--good)} .down{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;align-items:center}
.grid2 .lbl{font-size:14px}
.empty{color:var(--muted);font-size:14px}
.banner{font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted)}
@media (min-width:640px){.row1 .views{order:0;width:auto}}
.chartbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;padding:0 6px 6px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:8px;padding:6px 8px;line-height:1.35;white-space:nowrap;z-index:2}
.tip b{font-weight:600}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.guide{display:flex;flex-direction:column;gap:6px;font-size:15px}
.guide h3{margin:0;font-size:16px}
.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.guide dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.guide dt{font-weight:600}
.guide dd{margin:0;color:var(--muted)}
.sbx{font-size:11px;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--warn);color:var(--surface);vertical-align:3px}
.actions{display:flex;gap:16px;align-items:center}
.chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.editor{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.editor h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld input,.fld select{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}
.fld.wide{grid-column:1/-1}
/* iOS gives date boxes a wide built-in size that ignores width:100%, so they spill into the next cell: reset it, and give dates their own row */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:42px;line-height:1.25;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto}
.fgrid > *,.dayrow > *,.sets > *,.stiles > *,.partrow > *{min-width:0}
.fgrid > .fld:has(input[type=date]){grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.edbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.text{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:10px 4px;margin-left:auto}
.partrow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
.menubtn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}

  CHART_AXIS.spans.forEach((sp, k) => { if (k % 2 === 1) g += `<rect x="${x(sp.s) - cw/2}" y="${mt}" width="${(sp.e - sp.s + 1) * cw}" height="${H-mt-mb}" fill="var(--sunk)"/>`; });
  const every = N > 16 ? 2 : 1;
  for (let w = 1; w <= N; w++) if ((w - 1) % every === 0) g += `<text x="${x(w)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${w}</text>`;
  return g;
}
function showTip(rect){
  const c = CHARTS[rect.dataset.chart], w = +rect.dataset.wk, box = rect.closest(".chartbox"); if (!c || !box) return;
  const tip = box.querySelector(".tip"), svg = box.querySelector("svg"), xh = svg.querySelector(".xh");
  const rows = c.series.map(s => s.vals[w-1] == null ? "" : `<div>${c.series.length > 1 ? `<i style="background:${s.color}"></i>` : ""}${esc(s.label)} <b>${fmt(s.vals[w-1])} ${c.unit}</b>${s.names && s.names[w-1] ? ` · ${esc(s.names[w-1])}` : ""}</div>`).join("");
  tip.innerHTML = `<div><b>${c.labels && c.labels[w - 1] ? esc(c.labels[w - 1]) : `Week ${w}`}</b></div>` + (rows || "<div>Nothing logged</div>");
  const scale = svg.getBoundingClientRect().width / c.W, px = c.x(w) * scale + 8;
  xh.setAttribute("x1", c.x(w)); xh.setAttribute("x2", c.x(w)); xh.setAttribute("visibility", "visible");
  tip.hidden = false;
  const left = Math.min(Math.max(px - tip.offsetWidth/2, 4), box.clientWidth - tip.offsetWidth - 4);
  tip.style.left = left + "px"; tip.style.top = "8px";
}
function hideTips(){ document.querySelectorAll(".chartbox .tip").forEach(t => t.hidden = true); document.querySelectorAll(".chartbox .xh").forEach(l => l.setAttribute("visibility","hidden")); }
document.addEventListener("pointermove", e => { const r = e.target.closest && e.target.closest("rect[data-wk]"); if (r) showTip(r); else hideTips(); });
document.addEventListener("pointerdown", e => { const r = e.target.closest && e.target.closest("rect[data-wk]"); if (r) showTip(r); else hideTips(); });

const GUIDE_DEFAULT = [

  {id:"blocks", title:"Blocks", body:"Weeks 1–4: {block1}. Main lifts 4 × 6–8 at 70–75%. Week 4 is lighter.\nWeeks 5–8: {block2}. Main lifts 4–5 × 3–5 at 77.5–85%. New assistance exercises. Week 8 is lighter.\nWeeks 9–12: {block3}. Top triple at 85–90% plus back-off sets. Week 12 is an AMRAP at 85% and the benchmark retest.\nAssistance exercises change each block. The main lifts stay the same so your progress is comparable."},
  {id:"effort", title:"Effort targets", body:"- RPE 10: nothing left. RPE 9: one rep left. RPE 8: two left. RPE 7: three left.\n- RIR means reps in reserve, so RIR 2 is the same as RPE 8.\n- Jumps, throws and cleans: never grind. End the set when speed drops.\n- Accessories use double progression: hit the top of the rep range on every set, then add weight next time."},
  {id:"structure", title:"Supersets and EMOMs", body:"Superset: Do A1, go straight to A2, then rest. \"→ A2\" in the rest column means no rest. Any cards sharing a letter with numbers (A1, A2, A3…) are linked up automatically, so relabelling a card is all it takes to add it to a superset or take it out.\nEMOM: Start the reps at the top of every minute and rest for what's left of it.\nLighter weeks (4, 8 and 12) drop the intensifiers and cut accessory work to 2 sets."},

function guideSections(){
  const G = S.plan.guide || {}, ed = G.edits || {};
  return GUIDE_DEFAULT.filter(x => !S.plan.blank || !["plan", "layout", "blocks"].includes(x.id)).map(x => Object.assign({}, x, ed[x.id] || {}, {builtin:true, changed: !!ed[x.id]})).concat((G.custom || []).map(x => Object.assign({}, x, {builtin:false})));
}
function guideBody(text){
  // "Label: text" lines become a definition list, "- " lines become bullets, anything else is a paragraph
  const t = String(text || "").replace(/\{block([123])\}/g, (m, b) => blockName(+b));
  const out = []; let mode = null, buf = [];
  const flush = () => { if (!buf.length) return; out.push(mode === "dl" ? `<dl>${buf.join("")}</dl>` : mode === "ul" ? `<ul>${buf.join("")}</ul>` : buf.join("")); buf = []; mode = null; };
  t.split("\n").map(x => x.trim()).filter(Boolean).forEach(line => {
    const li = line.match(/^[-•]\s*(.+)$/), dl = line.match(/^([^:]{1,24}):\s+(.+)$/);
    const m = li ? "ul" : dl ? "dl" : "p";
    if (m !== mode) flush(); mode = m;
    buf.push(m === "ul" ? `<li>${esc(li[1])}</li>` : m === "dl" ? `<dt>${esc(dl[1])}</dt><dd>${esc(dl[2])}</dd>` : `<p class="gp">${esc(line)}</p>`);
  });
  flush(); return out.join("");
}

function guideIntens(sec){

async function offerFile(filename, text){
  if (!IS_APP) {
    try { const dl = await window.claude?.use?.("downloads"); if (dl) { await dl.save({filename, data: text}); toast(`Saved ${filename}.`); return; } }
    catch (e) { if (e && e.code === "declined") return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], {type: filename.endsWith(".json") ? "application/json" : "text/plain"}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast(`Downloaded ${filename}.`);
  } catch (e) { toast("Couldn't create the file here.", "err", "Download failed."); }
}
function exportData(kind){
  const base = {app: "training-app", version: 1, exported: new Date().toISOString()};
  if (kind === "templates") return offerFile(`training-templates-${todayISO()}.json`, JSON.stringify(Object.assign(base, {type: "templates", tpls: clone(TPLS)}), null, 1));
  return offerFile(`training-backup-${todayISO()}.json`, JSON.stringify(Object.assign(base, {type: "all", runs: clone(RUNS), idx: clone(RUNIDX), tpls: clone(TPLS)}), null, 1));
}
function readImport(file){
  const r = new FileReader();
  r.onload = () => {
    let P = null; try { P = JSON.parse(r.result); } catch (e) {}
    if (P && P.format === PFORMAT) { receiveProgramme(P, file.name); return; }
    if (!P || P.app !== "training-app" || (P.type === "all" && !(P.runs && P.idx && Array.isArray(P.idx.list))) || (P.type === "templates" && !P.tpls)) { ui.data = {}; render(); flagError("That file isn't a backup or template file from this app.", ["imp-file"], "Can't import."); return; }
    ui.data = {pending: P, name: file.name}; render();
  };
  r.onerror = () => flagError("Couldn't read that file.", ["imp-file"], "Can't import.");
  r.readAsText(file);
}
function allDids(){ const out = ["runs"]; Object.entries(RUNS).forEach(([r, R]) => { const p = runPrefix(r); out.push(p + "plan", p + "settings", p + "body"); Object.keys(R.sessions).forEach(k => out.push(p + k)); }); Object.keys(TPLS).forEach(k => out.push("tpl." + k)); return out; }
async function pushAll(dids){ cache(); if (mode !== "db") { setStatus(); return; } for (const d of dids) { clearTimeout(timers[d]); delete timers[d]; await flush(d); } }
function addTemplates(tpls){
  let n = 0;
  Object.values(tpls || {}).forEach(t => { if (!t || !t.plan) return; let id = t.id || ("t" + Date.now().toString(36) + n); if (TPLS[id] && JSON.stringify(TPLS[id]) === JSON.stringify(t)) return; if (TPLS[id]) id = "t" + Date.now().toString(36) + n; TPLS[id] = Object.assign({}, t, {id, imported: new Date().toISOString()}); saveDid("tpl." + id); n++; });
  return n;
}
function replaceAll(P){

  if (RUNIDX.videos != null) RUNIDX.videos = cleanVideos(RUNIDX.videos);
  Object.values(RUNS).forEach(R => { R.sessions = R.sessions || {}; R.settings = R.settings || {e1rm: {}, round: 2.5}; R.body = R.body || {bw: {}, bench: {}}; R.plan = R.plan || {edits: []}; normalizePlan(R.plan); if (R.plan.lifts != null) { const L = normLifts(R.plan.lifts); if (L) R.plan.lifts = L; else delete R.plan.lifts; } if (R.plan.videos != null) R.plan.videos = cleanVideos(R.plan.videos); });

}

rom its own page.</p><p><span class="k">Travel swaps:</span> next to Move or skip, <span class="k">Travel swaps</span> swaps the session's exercises for what you've got: a hotel gym, dumbbells only, or bodyweight only. Untick any you want to keep. It only changes that session, and each card's editor has Back to plan.</p><p><span class="k">Target date:</span> add a competition, race or test day to your run in Programmes &amp; runs. If the plan would finish before or after it, the Train screen offers to line it up by adding or removing weeks in the block before your final block, so your taper still lands on the day.</p><p><span class="k">Athletic profile:</span> the top of Progress compares how your strength, power and conditioning have moved in this run, using your main lifts, jumps and cleans you've logged, and your benchmarks (jump or sprint tests count as power; rows, runs and carries as conditioning). It also shows each lift against your bodyweight, and flags it when strength is running ahead of power or conditioning.</p><p><span class="k">Readiness check-in:</span> before a session, tap how you slept, how sore you are and your energy (and, if you like, how your first warm-up set felt). On a flat day it suggests taking 2.5% off the % lifts; on a rough day, 5% and one fewer set on accessories. Tap Apply and the suggested weights for that session change; nothing else in the plan does. Block reviews show how often you checked in and eased off. Turn it off on the Maxes tab.</p><p><span class="k">Demo videos:</span> tap <span class="k">Find a demo</span> on any exercise, then <span class="k">Search YouTube</span>. When you find a good one, tap Share → Copy link in YouTube, come back and tap <span class="k">Paste and pin</span> (or paste it into the box and tap Pin). From then on every card for that exercise has a ▶ button that opens it. Pins you make in your runs apply to all your programmes; pins made while editing a programme belong to it and go with it when you share it.</p><p><span class="k">Main lifts:</span> each programme has its own. On the Maxes tab, <span class="k">Edit main lifts</span> adds, renames or removes them, or adds a preset (strongman, Olympic, powerlifting). A lift can be <span class="k">Max weight</span> (estimated 1RM and % suggestions), <span class="k">Reps at a weight</span> (most reps at or above your working weight), or an <span class="k">Event</span> logged as weight plus time or distance (yoke, farmer's carry). Each main lift is an exercise from the list, so wherever that exercise appears in your plan it counts automatically. To count a variation as well (pause squats as squat, say), set "Main lift" in that exercise's editor. Progress, block reviews and carry-over maxes all follow your list.</p><p><span class="k">Training load:</span> at the bottom of each day, rate how hard the whole session was (1–10). Minutes fill in from when you ticked your first set to when you tapped Finish, or type your own. Progress shows weekly load for lifting and conditioning together, plus any other activity you add, and marks weeks more than 30% above your recent average.</p><p><span class="k">Block reviews:</span> Progress → Block reviews shows sessions and sets completed, each main lift against the max you used, how your logged weights compared with the suggestions, best sets against earlier blocks, and load. It proposes maxes for the next block from what you actually lifted; edit them and tap Use these. Copy as text sends it to a coach.</p><p><span class="k">Session summary:</span> finishing a session shows your sets, reps, volume, any PRs and your best sets against the same day last week. <span class="k">Copy as text</span> makes it easy to send to a coach. Turn it off on the Maxes tab.</p><p>Most actions (editing, removing, moving or skipping) show a pop-up with <span class="k">Undo</span> for a few seconds. When logging, the keyboard's <span class="k">Next</span> key jumps to the next box. When adding or swapping an exercise, type to search and tap one; the list closes and shows your choice, with <span class="k">Change</span> to pick again. <span class="k">Put it in</span> at the top of Add exercise chooses which weeks it goes in, and it remembers your last choice (when building a programme it starts with every week). <span class="k">Add, then add another</span> keeps the panel open for the next one.</p><p>The <span class="k">menu</span> button (top left) opens everything else: Programmes &amp; runs, the Programme guide, this User guide and Appearance. On a wide screen the menu stays open at the side.</p><p>The run name above the week number shows which run you're logging, and its dates if it has a start date. Tap it to manage runs. <span class="k">Today</span>, next to the dates, jumps to today's session.</p><p>Under each day's title: the <span class="k">Track rest</span> switch for the rest timer, and <span class="k">Move or skip</span>. Tap an exercise's name for its history and records.</p>`, true);
  h += sec("Logging a session", `<ol><li>Pick the week with the arrows and the day from the tabs.</li><li>Grey numbers in the set boxes are your targets. Tap <span class="k">✓</span> on an empty set to log it exactly as written, or type what you did.</li><li>Change a weight and the empty sets below follow it.</li><li>"Last" under an exercise shows what you did the previous time it came up.</li><li>Add notes to any exercise, plus session notes at the bottom, then tap <span class="k">Finish session</span>.</li></ol><p>Jumps log height or distance in cm. Bodyweight moves log reps only. Weighted chin-ups and dips log the added weight. Everything saves as you type; the dot top right shows Saving, then Saved.</p>`);
  h += sec("Rest timer", `<p>Turn on <span class="k">Track rest</span> under the day's title. It's off until you switch it on, and the setting is remembered on this device.</p><ul><li>Ticking a set starts a countdown at the bottom of the screen, using the rest time on that card. For a range like "2–3 min" it counts down from the longer time.</li><li>It shows what's next: the next set, back to the start of a superset, or the next exercise.</li><li>Use <span class="k">−15</span> and <span class="k">+15</span> to adjust, or <span class="k">Skip</span>.</li><li>Between superset cards (A1 → A2) there's no rest: it just tells you to go straight to the next one. The timer starts after the last card in the group.</li><li>When time's up it beeps (turn <span class="k">Sound</span> off if you'd rather not) and vibrates where the phone allows, and the bar turns green. The screen stays on while the timer runs.</li></ul><p>On iPhone, web apps can't vibrate, and the silent switch mutes the beep.</p>`);
  h += sec("Warm-up sets", `<p>Every barbell or dumbbell card has a <span class="k">Suggested warm-up sets</span> tab. Open it to see a ramp up to your first working set, starting with the empty bar, and tick each one off as you go. The ramp follows your first set's weight, or the suggested weight if you haven't typed one yet.</p><ul><li><span class="k">Your defaults:</span> set your bar weight and default ramp on the <span class="k">Maxes</span> page, written as % of working weight × reps, e.g. "40×5, 60×3, 80×2".</li><li><span class="k">Per exercise:</span> in <span class="k">Edit exercise</span>, choose <span class="k">Tab only</span> or <span class="k">Show on card</span> (open every time), and give it its own ramp if you like.</li><li><span class="k">New exercises:</span> <span class="k">Add exercise</span> has a "show warm-up sets on the card" option.</li></ul><p>Warm-up sets aren't counted in your records or progress.</p>`);
  h += sec("Today, missed and moved sessions", `<p>Once your run has a start date (Programmes &amp; runs), a <span class="k">Today</span> button appears next to the week's dates. It opens today's session. On a rest day it shows the next session and tells you when it is.</p><p>Earlier sessions this week that aren't done appear at the top under <span class="k">Not done yet this week</span>, with:</p><ul><li><span class="k">Swap with today</span> (or <span class="k">Move to today</span> on a free day): does the missed session today and puts today's session on the missed day, for this week only.</li><li><span class="k">Skip:</span> marks it as skipped. Its tab shows "skipped" and it stops being flagged.</li></ul><p><span class="k">Move or skip</span> under any day's title moves that session to another day of the same week:</p><ul><li><span class="k">A free day:</span> the session simply moves there.</li><li><span class="k">A day that already has a session:</span> the two swap by default, so each day keeps one session. Choose <span class="k">Do both that day</span> if you're training twice; the moved one then gets a heading like "from Wed".</li><li><span class="k">Undoing:</span> <span class="k">Put back on …</span> returns a session (and anything it swapped with) to its usual day. <span class="k">Undo all moves this week</span> resets the whole week.</li></ul><p>Moved sessions show "was Wed" under their tab. Anything you've logged moves with the session, moves only ever affect that one week, and optional days or days before your start date are never flagged.</p>`);
  h += sec("Records and exercise history", `<p>When a set beats your best from any other session, its set number changes to a red <span class="k">PR</span> and a message tells you what kind:</p><ul><li><span class="k">e1RM PR:</span> your best estimated max (weight × (1 + reps ÷ 30)).</li><li><span class="k">Rep PR:</span> the most weight for that number of reps, e.g. a "5-rep PR".</li><li><span class="k">Heaviest yet</span>, <span class="k">Best yet</span> (jumps) or <span class="k">Rep PR</span> (bodyweight moves).</li></ul><p>Records count across all your runs. You need at least one earlier session of that exercise before anything counts as a PR, so your first session never fills up with them.</p><p>Tap any exercise name on a card to open its history: best e1RM and heaviest set with when you did them, a chart of your best set each session, a rep-max table, and every session listed. The <span class="k">Records</span> list on Progress links to the history of every exercise you've logged.</p>`);
  h += sec("Supersets, circuits and EMOMs", `<p>Cards that share a letter with numbers (A1, A2, A3…) are a superset. They get a coloured border, each points to the next, and the rest comes after the last. Relabel a card in its editor to add it to a superset or take it out.</p><p><span class="k">Add exercise</span> can also add a <span class="k">Circuit</span> (rounds, rest between rounds and any number of parts) or an <span class="k">EMOM</span> (minutes, and one or more moves that rotate each minute). Edit either later to change rounds, minutes or parts.</p>`);
  h += sec("Changing exercises", `<p>Tap <span class="k">Edit exercise</span> on any card to swap the exercise, change its label, sets, reps, effort, rest, weight, coaching note or intensifier, or remove it from the day.</p><p>Every change asks how far it should reach: this week, the rest of the block, or every remaining week. Extra sets scale down in lighter weeks, and intensifiers skip them. <span class="k">Back to plan</span> undoes a change.</p><p>Main lifts keep feeding Progress whatever variation you swap in. <span class="k">Reorder</span> at the bottom of a day moves cards up and down.</p>`);
  h += sec("Warm-ups, benchmark tests and intensifiers", `<p><span class="k">Change warm-up</span> picks a built-in warm-up, one you've written, or none. Edit a warm-up and it changes everywhere it's used.</p><p>Benchmark test cards work the same way: <span class="k">Change test</span> swaps or edits the test and sets whether it counts as your start or end result. <span class="k">Add benchmark test</span> puts a new one on any day. Results you type there appear on Progress.</p><p>Intensifiers (drop sets, myo-reps, cluster sets and more) are picked in an exercise's editor. Edit or add your own in the Programme guide.</p>`);
  h += sec("Days, weeks and blocks", `<p>Tap <span class="k">+ Days</span> at the end of the day tabs to add a day (blank or a copy of another), move a day, rename it, mark it optional or remove it. Two sessions on the same weekday each need their own heading, like AM and PM.</p><p>Tap the block name under the week number to rename the block, set how many weeks it has, repeat or remove single weeks, or add, remove and restore whole blocks.</p><p>Removed days, weeks and exercises keep anything you logged and come back if you put them back.</p>`);
  h += sec("Programmes, templates and runs", `<p>Open <span class="k">Programmes &amp; runs</span> from the menu.</p><ul><li><span class="k">Save as a template:</span> keep the whole programme, or one block, with all your changes.</li><li><span class="k">Start a run:</span> begin any template again with its own log, maxes, progress and dates. Runs are numbered and dated, so repeats never mix.</li><li><span class="k">Add to this run:</span> put a saved block into the programme you're on.</li><li><span class="k">Create a programme:</span> Programmes &amp; runs → <span class="k">New programme</span>. Name it, set its blocks (weeks each, and whether the last week is lighter) and tick your training days. It then opens in the editor, where you add exercises day by day with the usual tools. "Apply to" picks which weeks each change goes in. When adding a lift you can base its weight on a % of a max that climbs each week. Tap <span class="k">Save programme</span> when you're done, and <span class="k">Close</span> to get back to your own training.</li><li><span class="k">Edit a programme:</span> tap <span class="k">Edit</span> on any of your templates (or <span class="k">Copy and edit</span> on Hybrid 12). Saving only makes a new version once the programme has been shared or a run started from it.</li><li><span class="k">Share a programme:</span> tap <span class="k">Share</span> on any template for a link or a file. The other person taps the link (or imports the file in Backup &amp; data), adds it to their library and starts their own run. Your log and maxes are never included.</li><li><span class="k">Versions:</span> every template has a version number. Updating a template makes a new version, and when you share it again, anyone who already has it is offered the update.</li><li><span class="k">Updating a run:</span> when a newer version of the programme you're running arrives, Programmes &amp; runs offers to switch from a week you choose. Earlier weeks and everything you've logged stay as they are, and your own changes can come across too.</li><li><span class="k">Update a template:</span> copy this run's guide, or its whole plan, back into one of your templates so future runs start with it.</li><li><span class="k">Your runs:</span> open or archive any run.</li></ul>`);
  h += sec("Progress and maxes", `<p>Progress charts your best estimated max for each main lift every week, plus bodyweight. Tap a week on a chart for its numbers. Below that, <span class="k">Records</span> lists your best for every exercise you've logged.</p><p><span class="k">Edit benchmarks</span> renames, reorders, removes or adds tests. Link one to an exercise and it fills in from your log.</p><p>Maxes drive every suggested weight. Each block uses the previous block's max until you enter a new one. At the start of a block, put in your best e1RM from Progress, rounded down. The Maxes page also holds your bar weight and default warm-up ramp, and the rounding used for suggested weights.</p>`);
  h += IS_APP
    ? sec("Saving, backups and installing", `<p>Everything is saved on this device as you type, and the app works offline. Nothing is sent anywhere.</p><p>Back up regularly from <span class="k">Backup &amp; data</span> in the menu. The backup file can be loaded on another device, or after reinstalling. You can also export just your templates to share a programme with someone.</p><p><span class="k">Install it:</span> on Android or desktop Chrome, use <span class="k">Install app</span> in the menu (or the browser's install option). On iPhone, open it in Safari, tap Share, then <span class="k">Add to Home Screen</span>.</p><p>If something can't be saved, a message pops up and the box that needs changing is outlined.</p>`)
    : sec("Saving and your devices", `<p>Your log saves to your claude.ai account, so it's on any device where you're signed in. If the dot top right says <span class="k">This device</span>, saving is only happening in this browser. If something can't be saved, a message pops up and the box that needs changing is outlined.</p><p>Back up, or move your data to the installable app, from <span class="k">Backup &amp; data</span> in the menu. Programme links open in the installable app; here, paste a link into Backup &amp; data → Import instead. Appearance is set per device.</p>`);
  return h + `</div>`;
}

// ---------- editing the programme's main lifts ----------
function liftUsage(key){ let n = 0; schedVis().forEach(e => daysFor(e.id).forEach(dy => effItems(e.id, dy.key).forEach(it => { if (!it.removed && (it.pl === key || it.lift === key)) n++; }))); return n; }
function liftsPanel(){
  const F = ui.lifts;
  let h = `<div class="card editor" style="border:2px solid var(--accent)"><h3 style="margin:0;font-size:17px">Main lifts</h3><div class="hint">Pick the exercises this programme is built around. Each gets its own max, % suggestions, Progress line and block review, and every time that exercise is in your plan it counts automatically. To count a variation too (say, pause squats as squat), use "Main lift" in that exercise's editor.</div>`;
  if (F.err) h += `<div class="err">${esc(F.err)}</div>`;
  F.rows.forEach((L, i) => {
    const used = L.key && !L.isNew ? liftUsage(L.key) : 0;
    h += `<div class="dayrow"><div class="fgrid" style="grid-column:1/-1">${exPicker(L, {name: L.ex && !LIBIDX[L.ex] ? "__custom" : (L.ex || ""), custom: L.ex}, {p: "lift:" + i})}</div><label class="fld"><span>Short label</span><input id="lf-${i}-short" data-k="lff" data-r="${i}" data-f="short" value="${esc(L.short)}" maxlength="10" placeholder="e.g. Log"></label>`
      + `<label class="fld"><span>Type</span><select id="lf-${i}-type" data-k="lfsel" data-r="${i}" data-f="type">${Object.entries(LIFT_TYPES).map(([k, v]) => `<option value="${k}"${L.type === k ? " selected" : ""}>${v}</option>`).join("")}</select></label>`
      + (L.type === "event" ? `<label class="fld"><span>Measured by</span><select id="lf-${i}-ev" data-k="lfsel" data-r="${i}" data-f="ev"><option value="sec"${L.ev !== "m" ? " selected" : ""}>Time (faster wins)</option><option value="m"${L.ev === "m" ? " selected" : ""}>Distance (further wins)</option></select></label>` : `<span></span>`)
      + `<div class="edbtns" style="grid-column:1/-1"><span class="rx">${L.type === "max" ? "Suggested weights are a % of your estimated 1RM." : L.type === "reps" ? "Progress shows your most reps at or above the working weight." : `Log weight and ${L.ev === "m" ? "distance" : "time"} for each set.`}${used ? ` Used by ${used} exercise${used === 1 ? "" : "s"}.` : ""}</span><button class="btn text" data-k="lfdel" data-r="${i}" style="margin-left:auto">${F.confirm === i ? "Tap again to remove" : "Remove"}</button></div></div>`;
  });
  h += `<div class="edbtns"><button class="btn" data-k="lfadd">Add a lift</button><label class="fld" style="flex:1;min-width:12em"><span>Add from a preset</span><select id="lf-preset" data-k="lfpreset"><option value="">Choose…</option>${Object.entries(LIFT_PRESETS).filter(([k]) => k !== "none").map(([k, P]) => `<option value="${k}">${esc(P.label)}</option>`).join("")}</select></label></div>`;
  h += `<div class="edbtns"><button class="btn primary" data-k="lfsave">Save</button><button class="btn" data-k="lfcancel">Cancel</button></div></div>`;
  return h;
}
function saveLifts(){
  const F = ui.lifts, bad = [], names = new Set();
  F.rows.forEach((L, i) => { const n = (L.ex || "").trim().toLowerCase(); if (!n || names.has(n)) bad.push(i); names.add(n); });
  if (bad.length) { F.err = "Pick an exercise for each lift, and use each exercise only once."; const fe = F.rows.findIndex(L => !L.ex); F.rows.forEach((L, i) => { L.pick = i === fe; }); ui.exq = ""; render(); flagError(F.err, bad.map(i => `lf-${i}-short`), "Can't save yet."); return; }
  const rows = F.rows.map(L => { const o = Object.assign({}, L); delete o.isNew; delete o.pick; delete o.typeSet; o.name = o.ex; if (!o.key) o.key = "L" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); o.short = (o.short || "").trim() || o.name.trim().split(" ")[0].slice(0, 10); o.name = o.name.trim(); return o; });
  S.plan.lifts = normLifts(rows); ui.lifts = null; planChanged(); render(); toast("Main lifts saved.");
}
function viewSettings(){

  let h = `<div class="section"><h2>Your maxes</h2><p>These drive every suggested weight. Max-weight lifts use an estimated 1RM; rep and event lifts use a working weight (your competition weight, say). Each block uses the previous block's number until you enter a new one.</p></div>`;
  h += ui.lifts ? liftsPanel() : `<div class="card"><div class="ghead"><b>Main lifts</b><button class="addnote" data-k="lfopen">Edit main lifts</button></div><div class="liftpills">${liftList().map(L => `<button class="lp" data-k="hist" data-n="${esc(L.ex || L.name)}" title="History">${esc(L.name)}<small>${L.type === "max" ? "max" : L.type === "reps" ? "reps" : L.ev === "m" ? "distance" : "time"}</small></button>`).join("") || `<span class="rx">None yet.</span>`}</div><div class="rx">Every time one of these exercises is in your plan, it counts towards that lift. Tap one to see its history.</div></div>`;
  h += `<div class="card">`;
  bl.forEach(b => {
    h += `<h4 style="margin:4px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink)">${esc(blockName(b))} <span class="rx">· block ${blockOrd(b)}</span></h4><div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(92px,1fr))">`
      + liftList().map(L => { const l = L.key, arr = (S.settings.e1rm||{})[l] || []; return `<label class="fld"><span>${esc(L.short)}${L.type === "max" ? "" : " · wt"}</span><input class="num" id="mx-${l}-${b}" data-k="max" data-l="${esc(l)}" data-b="${b}" inputmode="decimal" value="${esc(arr[b-1] ?? "")}" placeholder="${maxFor(l, b) ? fmt(maxFor(l, b)) : "kg"}" aria-label="${esc(L.name)} ${esc(liftMaxWord(L))} ${esc(blockName(b))}"></label>`; }).join("") + `</div>`;
  });
  h += IS_APP || Array.isArray(S.plan.lifts) ? `<p class="rx">The grey numbers are examples. Enter your own estimated 1RMs: a recent heavy set works, e.g. 100 kg × 5 is about 117 kg (kg × (1 + reps ÷ 30)).</p></div>` : `<p class="rx">Starting points: squat 220 (from 200 for reps), bench 170 (160×3), deadlift 245 (230×3). Overhead press and power clean are estimates; correct them after week 1.</p></div>`;
  h += `<div class="card"><h3 style="margin:0;font-size:16px">Warm-up sets</h3><div class="fgrid"><label class="fld"><span>Bar weight (kg)</span><input class="num" id="set-bar" data-k="setf" data-f="bar" inputmode="decimal" value="${esc(S.settings.bar ?? "")}" placeholder="20"></label><label class="fld wide"><span>Default ramp (% of working weight × reps)</span><input id="set-wu" data-k="setf" data-f="wu" value="${esc(S.settings.wu ?? "")}" placeholder="${WU_DEFAULT}"></label></div><div class="hint">Every barbell or dumbbell card has a "Suggested warm-up sets" tab built from this, starting with the empty bar. Any exercise can have its own ramp in its editor.</div></div>`;
  h += `<div class="card"><h3 style="margin:0;font-size:16px">Coaching</h3><label class="chk"><input type="checkbox" data-k="setchk" data-f="nextOff"${S.settings.nextOff ? "" : " checked"}> Suggest next weights</label><div class="hint">For exercises with a rep range (like 3 × 10–12) and no % of max: when every set reaches the top of the range, next time suggests adding the rounding amount below. Otherwise it keeps the weight.</div>`
    + `<label class="chk"><input type="checkbox" data-k="setchk" data-f="noSummary"${S.settings.noSummary ? "" : " checked"}> Show a summary when I finish a session</label>`
    + `<label class="chk"><input type="checkbox" data-k="setchk" data-f="noReady"${S.settings.noReady ? "" : " checked"}> Readiness check-in before each session</label><div class="hint">Three taps (sleep, soreness, energy) that can ease the session off on a rough day. It only changes that one session.</div></div>`;
  h += `<div class="card"><label class="lbl" for="round"><b>Rounding</b> <span class="rx">smallest jump on the bar, kg</span></label><input class="num" id="round" data-k="round" inputmode="decimal" value="${esc(S.settings.round ?? 2.5)}" style="max-width:100px"></div>`;
  return h;
}

const UNDOABLE = new Set(["edsave", "edremove", "edrestore", "edreset", "mvtoday", "mvgo", "mvback", "mvundoall", "mvskip", "wkremove", "wkrestore", "wkrepeat", "wklight", "ordsave", "ordreset", "wsave", "wreset", "tremove", "trestore", "tsave", "addsave", "addmore", "dayssave", "daysreset", "pgsave", "lfsave", "trsave"]);
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  undoArmed = false;

      const did = doc.id; seen.add(did);
      if (did === "reset") return;
      if (timers[did] || inflight[did] || doc.metadata.hasPendingWrites) return;
      const data = JSON.parse(JSON.stringify(doc.data() || {}));
      const [r, k] = parseDid(did);
      if (r === "runs") { if (Array.isArray(data.list) && JSON.stringify(RUNIDX) !== JSON.stringify(data)) { const was = RUNIDX.active; RUNIDX = data; if (!RUNS[RUNIDX.active]) RUNS[RUNIDX.active] = blankRun(); if (RUNIDX.active !== was) { S = RUNS[RUNIDX.active]; planVer++; EFF.clear(); } changed = true; } return; }
      if (r === "tpl") { if (JSON.stringify(TPLS[k]) !== JSON.stringify(data)) { TPLS[k] = data; changed = true; } return; }
      const R = RUNS[r] || (RUNS[r] = blankRun());
      if (k === "settings") { if (JSON.stringify(R.settings) !== JSON.stringify(data)) { R.settings = Object.assign({e1rm:{}, round:2.5}, data); changed = true; } }
      else if (k === "plan") { if (JSON.stringify(R.plan) !== JSON.stringify(data)) { R.plan = Object.assign({edits:[]}, data); if (normalizePlan(R.plan)) saveDid(did); if (R === S) { planVer++; EFF.clear(); } changed = true; } }
      else if (k === "body") { if (JSON.stringify(R.body) !== JSON.stringify(data)) { R.body = Object.assign({bw:{}, bench:{}}, data); changed = true; } }
      else if (/^w\d+-\w+$/.test(k)) { if (JSON.stringify(R.sessions[k]) !== JSON.stringify(data)) { R.sessions[k] = Object.assign({sets:{}, notes:{}, results:{}, note:"", done:false}, data); changed = true; } }
    });
    if (!snap.metadata.fromCache) {
      if (first) {
        first = false;
        // anything saved on this device before the store was reachable gets uploaded once
        Object.entries(RUNS).forEach(([rid, R]) => {
          const pre = runPrefix(rid);
          Object.keys(R.sessions).forEach(id => { if (!seen.has(pre + id) && hasData(R.sessions[id])) saveDid(pre + id); });
          if (!seen.has(pre + "settings") && (Object.keys(R.settings.e1rm||{}).length || rid !== "main")) saveDid(pre + "settings");
          if (!seen.has(pre + "plan") && (JSON.stringify(R.plan) !== JSON.stringify({edits:[]}) || rid !== "main")) saveDid(pre + "plan");
          if (!seen.has(pre + "body") && (Object.keys(R.body.bw||{}).length || Object.keys(R.body.bench||{}).length || rid !== "main")) saveDid(pre + "body");
        });
        if (!seen.has("runs") && (RUNIDX.list.length > 1 || RUNIDX.list.some(x => x.name || x.started))) saveDid("runs");
        Object.keys(TPLS).forEach(k => { if (!seen.has("tpl." + k)) saveDid("tpl." + k); });
      } else {
        // templates deleted on another device go here too
        Object.keys(TPLS).forEach(k => { const did = "tpl." + k; if (!seen.has(did) && !timers[did] && !inflight[did]) { delete TPLS[k]; changed = true; } });
      }
    }
    if (changed) { cache(); const a = document.activeElement; if (!(a && a.dataset && a.dataset.k)) render(); }
    setStatus();
  }, err => { mode = "local"; errMsg = ""; setStatus(); render(); });
}
function hasData(s){ return s && (s.done || s.note || Object.keys(s.sets||{}).length || Object.keys(s.notes||{}).length || Object.keys(s.results||{}).length); }

function setDrawer(open){
  const d = document.getElementById("drawer"), sc = document.getElementById("scrim"), mb = document.getElementById("menubtn");
  d.classList.toggle("open", open); sc.classList.toggle("open", open); mb.setAttribute("aria-expanded", String(open));
  if (open) { const f = d.querySelector('[aria-current="page"]') || d.querySelector("button[data-view]"); if (f) setTimeout(() => f.focus(), 30); }
  else if (document.activeElement && d.contains(document.activeElement) && !matchMedia("(min-width:1280px)").matches) mb.focus();
}
document.getElementById("scrim").addEventListener("click", () => setDrawer(false));
document.addEventListener("change", e => { if (e.target && e.target.id === "imp-file" && e.target.files && e.target.files[0]) readImport(e.target.files[0]); });
if (IS_APP) { const tg = document.getElementById("sbxtag"); if (tg) tg.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("drawer").classList.contains("open")) setDrawer(false); });
function flushAll(){ Object.keys(timers).forEach(id => { clearTimeout(timers[id]); delete timers[id]; flush(id); }); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });
window.addEventListener("pagehide", flushAll);
try { document.getElementById("exlist").innerHTML = LIB.flatMap(([c, xs]) => xs.map(x => `<option value="${esc(x.name)}">`)).join(""); } catch (e) {}
if (IS_APP && !lsGet(WELCOME_KEY)) ui.setup = {step: 1};
render(); setStatus(); connect();
(function openSharedLink(){
  const m = location.hash.match(/^#p=([A-Za-z0-9_-]+)/); if (!m) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  unpackCode(m[1]).then(P => receiveProgramme(P, "Shared link")).catch(() => { ui.view = "data"; render(); flagError("That link is incomplete or isn't a programme link.", ["imp-code"], "Can't open that link."); });
})();
