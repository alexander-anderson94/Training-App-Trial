<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training App</title>
<meta name="description" content="Log your training: sessions, supersets, progress, programmes and runs. Works offline.">
<meta name="theme-color" content="#14191F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a gym logbook — sticky week/day bar, then one card per exercise with tap-to-fill set rows. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#14191F; --muted:#5B6570; --line:#D9DEE4;
  --accent:#C62828; --accent-ink:#FFFFFF; --good:#2E7D4F; --good-soft:#E3F2E9; --warn:#9A6400;
  --b1:#2E6F95; --b2:#8A5A2B; --b3:#7A2E3A; --ss:#7B57D9; --ss-soft:#F1ECFC;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1215; --surface:#181D22; --sunk:#12161A; --ink:#E9EDF1; --muted:#97A2AD; --line:#2A3239;
  --accent:#EF5350; --accent-ink:#14191F; --good:#5CBF84; --good-soft:#163024; --warn:#E0A84A;
  --b1:#5FA3CC; --b2:#C48A55; --b3:#C46677; --ss:#A88BF2; --ss-soft:#221B33; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1215; --surface:#181D22; --sunk:#12161A; --ink:#E9EDF1; --muted:#97A2AD; --line:#2A3239;
  --accent:#EF5350; --accent-ink:#14191F; --good:#5CBF84; --good-soft:#163024; --warn:#E0A84A;
  --b1:#5FA3CC; --b2:#C48A55; --b3:#C46677; --ss:#A88BF2; --ss-soft:#221B33; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}

/* colour palettes: light values, then dark (system dark unless forced light, and forced dark) */
:root[data-palette="forest"]{--bg:#EDF1EE;--surface:#FFFFFF;--sunk:#F4F7F5;--line:#D5DED8;--ink:#13201B;--muted:#56655E;--accent:#1F6F5C;--accent-ink:#FFFFFF;--b1:#2C6E63;--b2:#8A6A1F;--b3:#7C3A2D;--ss:#6A4FC4;--ss-soft:#EFEBFA}
@media (prefers-color-scheme: dark){:root[data-palette="forest"]:not([data-theme="light"]){--bg:#0E1412;--surface:#16201C;--sunk:#111915;--line:#26332D;--ink:#E6EFEA;--muted:#93A69D;--accent:#4FB79A;--accent-ink:#0E1412;--b1:#5DB3A4;--b2:#D1A651;--b3:#D17A66;--ss:#A891F0;--ss-soft:#211C31}}
:root[data-palette="forest"][data-theme="dark"]{--bg:#0E1412;--surface:#16201C;--sunk:#111915;--line:#26332D;--ink:#E6EFEA;--muted:#93A69D;--accent:#4FB79A;--accent-ink:#0E1412;--b1:#5DB3A4;--b2:#D1A651;--b3:#D17A66;--ss:#A891F0;--ss-soft:#211C31}
:root[data-palette="ocean"]{--bg:#EDF2F8;--surface:#FFFFFF;--sunk:#F4F7FB;--line:#D4DDE8;--ink:#111A26;--muted:#56637A;--accent:#1F5FBF;--accent-ink:#FFFFFF;--b1:#1F5FBF;--b2:#16808F;--b3:#5B4FB3;--ss:#C2410C;--ss-soft:#FDEEE5}
@media (prefers-color-scheme: dark){:root[data-palette="ocean"]:not([data-theme="light"]){--bg:#0C121B;--surface:#141C28;--sunk:#0F1620;--line:#243042;--ink:#E6EDF6;--muted:#93A1B6;--accent:#5B9BF0;--accent-ink:#0C121B;--b1:#6EA6F2;--b2:#4FC0CF;--b3:#9A8FEA;--ss:#F08A55;--ss-soft:#2E1C12}}
:root[data-palette="ocean"][data-theme="dark"]{--bg:#0C121B;--surface:#141C28;--sunk:#0F1620;--line:#243042;--ink:#E6EDF6;--muted:#93A1B6;--accent:#5B9BF0;--accent-ink:#0C121B;--b1:#6EA6F2;--b2:#4FC0CF;--b3:#9A8FEA;--ss:#F08A55;--ss-soft:#2E1C12}
:root[data-palette="ember"]{--bg:#F6F0EB;--surface:#FFFDFB;--sunk:#FAF5F1;--line:#E5D9CF;--ink:#22170F;--muted:#6E5E52;--accent:#C2410C;--accent-ink:#FFFFFF;--b1:#A3511C;--b2:#8C2F39;--b3:#5C3D7A;--ss:#2563A6;--ss-soft:#E8F0FA}
@media (prefers-color-scheme: dark){:root[data-palette="ember"]:not([data-theme="light"]){--bg:#16110D;--surface:#201913;--sunk:#1A140F;--line:#3A2E24;--ink:#F3EAE2;--muted:#B3A294;--accent:#F07A3E;--accent-ink:#16110D;--b1:#E09A5E;--b2:#E07A86;--b3:#B49AE0;--ss:#6FA8E8;--ss-soft:#14202E}}
:root[data-palette="ember"][data-theme="dark"]{--bg:#16110D;--surface:#201913;--sunk:#1A140F;--line:#3A2E24;--ink:#F3EAE2;--muted:#B3A294;--accent:#F07A3E;--accent-ink:#16110D;--b1:#E09A5E;--b2:#E07A86;--b3:#B49AE0;--ss:#6FA8E8;--ss-soft:#14202E}
:root[data-palette="graphite"]{--bg:#F1F1F1;--surface:#FFFFFF;--sunk:#F6F6F6;--line:#DADADA;--ink:#151515;--muted:#5E5E5E;--accent:#1C1C1C;--accent-ink:#FFFFFF;--b1:#333333;--b2:#5A5A5A;--b3:#7A7A7A;--ss:#7B57D9;--ss-soft:#F1ECFC}
@media (prefers-color-scheme: dark){:root[data-palette="graphite"]:not([data-theme="light"]){--bg:#0F0F0F;--surface:#1A1A1A;--sunk:#141414;--line:#2E2E2E;--ink:#EDEDED;--muted:#9E9E9E;--accent:#EDEDED;--accent-ink:#111111;--b1:#D6D6D6;--b2:#ADADAD;--b3:#8A8A8A;--ss:#A88BF2;--ss-soft:#221B33}}
:root[data-palette="graphite"][data-theme="dark"]{--bg:#0F0F0F;--surface:#1A1A1A;--sunk:#141414;--line:#2E2E2E;--ink:#EDEDED;--muted:#9E9E9E;--accent:#EDEDED;--accent-ink:#111111;--b1:#D6D6D6;--b2:#ADADAD;--b3:#8A8A8A;--ss:#A88BF2;--ss-soft:#221B33}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.row1 .views{order:3;width:100%}
.views button{flex:1}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.st-ok i{background:var(--good)} .status.st-busy i{background:var(--warn)} .status.st-err i{background:var(--accent)}
.views{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.views button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.weekbar{display:flex;align-items:center;gap:8px}
.runline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:4px}
.runbtn{border:0;background:none;padding:0;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.views button{padding:6px 8px}
.days button .sub{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow .need input,.wform .need input{border-color:var(--accent)}
.err{font-size:13px;color:var(--accent);font-weight:600}
.weekbar .nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.weekbar .nav:disabled{opacity:.35;cursor:default}
.wk{flex:1;min-width:0;text-align:center}
.wk b{display:block;font-family:var(--display);font-size:26px;line-height:1;letter-spacing:.02em}
.blkname{border:0;background:none;padding:2px 4px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blk);border-radius:6px}
.blkname svg{opacity:.7}
.wk span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blk)}
.days{display:grid;grid-template-columns:repeat(5,1fr) 44px;gap:2px;margin-bottom:-1px}
.days .dayedit{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;color:var(--muted)}
.dayrow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr;gap:8px;align-items:end;border-top:1px dashed var(--line);padding-top:10px}
.dayrow.off{opacity:.55}
.dayrow .edbtns{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.days button{border:0;border-bottom:3px solid transparent;background:none;padding:8px 0 9px;font-weight:600;color:var(--muted);position:relative}
.days button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--blk)}
.days button .tick{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--good);font-weight:600;height:13px}
.days button .opt{color:var(--muted);font-weight:500}
main .wrap{padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
.focus{font-size:14px;color:var(--muted);border-left:3px solid var(--blk);padding:2px 0 2px 10px}
.dayhead h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.card.main{border-left:4px solid var(--blk)}
.card.warm{background:var(--sunk)}
.wsteps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.nowarm{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.wform{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.wform textarea{min-height:110px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.guide .gp{margin:0;color:var(--ink)}
.guide dd .addnote{margin-left:4px;font-size:12px}
.guide textarea{min-height:160px}
.ch{display:flex;gap:10px;align-items:flex-start}
.tag{flex:none;min-width:30px;height:24px;padding:0 6px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:15px;display:grid;place-items:center}
.main .tag{background:var(--blk);border-color:var(--blk);color:var(--surface)}
.ttl{flex:1;min-width:0}
.ssbar{font-size:13px;color:var(--muted);margin:4px 0 -6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ssbar b{color:var(--ss);font-weight:700}
.card.ssc{border:2px solid var(--ss);box-shadow:inset 4px 0 0 var(--ss)}
.card.ssc .tag{background:var(--ss-soft);border-color:var(--ss);color:var(--ss)}
.ordrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.ordrow .btn{padding:8px 12px}
.ordrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{white-space:nowrap}
.ttl h3{margin:0;font-size:17px;font-weight:600;line-height:1.2}
.rx{font-size:13px;color:var(--muted);margin-top:2px}
.rx b{color:var(--ink);font-weight:600}
.sug{flex:none;text-align:right;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sug b{display:block;font-family:var(--display);font-size:22px;line-height:1;color:var(--ink);letter-spacing:0;text-transform:none}
.sug small{display:block;text-transform:none;letter-spacing:0;font-size:11px}
.note{font-size:13px;color:var(--warn);font-weight:500}
.last{font-size:12px;color:var(--muted)}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center}
.sets .hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets .n{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted);text-align:center}
input.num,input.txt,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:16px}
input.num{text-align:center;font-weight:600}
input.num::placeholder{color:var(--muted);font-weight:400;opacity:.75}
textarea{resize:vertical;min-height:40px;font-size:15px}
.ok{width:44px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;color:var(--muted)}
.ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.done-row input.num{background:var(--good-soft);border-color:transparent}
.e1{font-size:12px;color:var(--muted);text-align:right}
.e1 b{color:var(--ink)}
.parts{display:flex;flex-direction:column;gap:4px;font-size:14px}
.parts div{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:4px}
.parts span{color:var(--muted);white-space:nowrap}
.addnote{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.finish{border:0;border-radius:var(--r);padding:14px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.finish.is-done{background:var(--good-soft);color:var(--good)}
.section h2{font-family:var(--display);font-size:22px;margin:4px 0 0;text-transform:uppercase;letter-spacing:.02em}
.section p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
tr.blkrow td{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);text-align:left}
td input.num{padding:6px;max-width:84px}
tfoot td{font-weight:600}
.up{color:var(--good)} .down{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;align-items:center}
.grid2 .lbl{font-size:14px}
.empty{color:var(--muted);font-size:14px}
.banner{font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--muted)}
@media (min-width:640px){.row1 .views{order:0;width:auto}}
.chartbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 6px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;padding:0 6px 6px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:8px;padding:6px 8px;line-height:1.35;white-space:nowrap;z-index:2}
.tip b{font-weight:600}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.guide{display:flex;flex-direction:column;gap:6px;font-size:15px}
.guide h3{margin:0;font-size:16px}
.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.guide dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.guide dt{font-weight:600}
.guide dd{margin:0;color:var(--muted)}
.sbx{font-size:11px;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--warn);color:var(--surface);vertical-align:3px}
.actions{display:flex;gap:16px;align-items:center}
.chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.editor{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.editor h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld input,.fld select{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink)}
.fld.wide{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.edbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.text{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:10px 4px;margin-left:auto}
.partrow{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
.menubtn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.row1 .brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.row1 .brand{font-size:17px}.row1 .brand .sbx{font-size:10px}}
.drawer{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));overflow-y:auto;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease, visibility 0s linear .22s}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.drawer-run{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--sunk)}
.drawer-run b{display:block;color:var(--ink);font-size:14px}
.drawer-group{display:flex;flex-direction:column;gap:2px}
.drawer-group span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px 10px}
.drawer-group button{border:0;background:none;text-align:left;padding:10px;border-radius:8px;font-weight:600;font-size:15px;color:var(--ink)}
.drawer-group button[aria-current="page"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
@media (min-width:1280px){
  .drawer{transform:none;visibility:visible;transition:none;z-index:4;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .drawer-head #menuclose{display:none}
  .scrim{display:none}
  .row1 > .menubtn{display:none}
  header.top,main{margin-left:300px}
}
.toast{position:fixed;left:50%;width:max-content;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--surface);
  border-radius:12px;padding:12px 16px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start}
.toast.err{background:var(--accent);color:var(--accent-ink)}
.toast b{font-weight:700;white-space:nowrap}
.invalid,.fld input.invalid,.fld select.invalid{border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)!important}
.help details{border-top:1px solid var(--line);padding:10px 0}
.help details:first-of-type{border-top:0}
.help summary{cursor:pointer;font-weight:600;font-size:16px;list-style-position:outside}
.help .hb{display:flex;flex-direction:column;gap:8px;margin-top:8px;color:var(--ink);max-width:65ch}
.help .hb p{margin:0}
.help .hb ul,.help .hb ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.help .k{font-weight:600}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pal button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:8px;font-weight:600;color:var(--ink)}
.pal button[aria-pressed="true"]{border:2px solid var(--ink);padding:9px}
.sw{display:flex;gap:4px}
.sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.08)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function viewPlans(){
  const P = ui.plans || (ui.plans = {}), act = runMeta(RUNIDX.active), weeks = schedVis().length, blocks = blockOrder();
  const loggedIn = id => { const R = RUNS[id]; return R ? Object.values(R.sessions).filter(x => x && x.done).length : 0; };
  let h = `<div class="section"><h2>This run</h2><p>Each run has its own log, maxes and progress, so running a programme again never mixes with earlier runs.</p></div>`;
  const ed = P.edit || {name: act.name || "", started: act.started || ""};
  h += `<div class="card"><div class="fgrid"><label class="fld wide"><span>Run name</span><input id="pl-name" data-k="plf" data-f="name" value="${esc(ed.name)}" maxlength="60" placeholder="${esc(runLabel(Object.assign({}, act, {name: ""})))}"></label>`
    + `<label class="fld"><span>Start date</span><input id="pl-start" type="date" data-k="plf" data-f="started" value="${esc(ed.started)}"></label></div>`
    + `<div class="rx">From the <b>${esc(act.tplName || "Hybrid 12")}</b> template · run ${act.seq || 1} · ${weeks} weeks in ${blocks.length} block${blocks.length === 1 ? "" : "s"}${act.started && weeks ? ` · ${fmtDate(act.started, true)} to ${fmtDate(new Date(weekMonday(schedVis()[weeks - 1].id).getTime() + 6 * 864e5).toISOString().slice(0, 10), true)}` : " · add a start date to see dates on every week and day"}</div>`
    + `<div class="edbtns"><button class="btn primary" data-k="plsave">Save</button></div></div>`;
  h += updatePanel(act, blocks);

  h += `<div class="section"><h2>Save as a template</h2><p>Keep this programme, or one of its blocks, with every change you've made, so you can run it again.</p></div>`;

  h += `<div class="card"><div class="seg" role="group" aria-label="Save">${[["programme", "Whole programme"], ["block", "One block"]].map(([k, l]) => `<button data-k="pltkind" data-v="${k}" aria-pressed="${T.kind === k}">${l}</button>`).join("")}</div><div class="fgrid">`
    + (T.kind === "block" ? `<label class="fld wide"><span>Block</span><select id="pt-block" data-k="ptsel" data-f="block">${blocks.map(b => `<option value="${b}"${String(T.block) === String(b) ? " selected" : ""}>Block ${blockOrd(b)} · ${esc(blockName(b))} (${blockWeeks(b).length} weeks)</option>`).join("")}</select></label>` : "")
    + `<label class="fld wide"><span>Template name</span><input id="pt-name" data-k="ptf" data-f="name" value="${esc(T.name)}" maxlength="60" placeholder="${esc(T.kind === "block" ? blockName(+T.block) : "e.g. Hybrid 12 v2")}"></label>`
    + `<label class="fld wide"><span>Notes (optional)</span><input id="pt-desc" data-k="ptf" data-f="desc" value="${esc(T.desc)}" maxlength="300" placeholder="What it's for, what you changed"></label></div>`
    + `<div class="edbtns"><button class="btn primary" data-k="ptsave">Save template</button>${P.savedMsg ? `<span class="rx">${esc(P.savedMsg)}</span>` : ""}</div></div>`;

  h += `<div class="section"><h2>Template library</h2></div>`;
  tplList().forEach(t => {
    const wks = planWeeks(t.plan).length, nb = planBlocks(t.plan).length, runs = (RUNIDX.list || []).filter(x => x.tpl === t.id).length;

      + `<div class="rx">${wks} week${wks === 1 ? "" : "s"}${t.kind === "block" ? "" : ` · ${nb} block${nb === 1 ? "" : "s"}`} · run ${runs} time${runs === 1 ? "" : "s"}${t.created ? ` · saved ${fmtDate(t.created.slice(0, 10), true)}` : ""}${t.updated ? ` · updated ${fmtDate(t.updated.slice(0, 10), true)}` : ""}</div>`
      + (t.desc ? `<div class="rx" style="color:var(--ink)">${esc(t.desc)}</div>` : "");
    if (P.start && P.start.tpl === t.id) {
      const A = P.start;
      h += `<div class="wform"><h4>Start a new run</h4><div class="fgrid"><label class="fld wide"><span>Run name</span><input id="ps-name" data-k="psf" data-f="name" value="${esc(A.name)}" maxlength="60" placeholder="${esc(`${t.name} · Run ${runs + 1}`)}"></label>`

        + (t.kind === "block" ? `<label class="fld"><span>Run the block</span><input id="ps-rep" data-k="psf" data-f="repeat" value="${esc(A.repeat)}" inputmode="numeric" placeholder="1"></label><label class="fld"><span>Main lifts % added each time</span><input id="ps-pct" data-k="psf" data-f="pct" value="${esc(A.pct)}" inputmode="decimal" placeholder="0"></label>` : "")

        + `<div class="edbtns"><button class="btn primary" data-k="pigo">Add block</button><button class="btn" data-k="picancel">Cancel</button></div></div>`;
    } else {
      h += `<div class="edbtns"><button class="btn primary" data-k="psopen" data-t="${t.id}">Start a run</button>${t.kind === "block" ? `<button class="btn" data-k="piopen" data-t="${t.id}">Add to this run</button>` : ""}${t.builtin ? "" : `<button class="btn text" data-k="ptdel" data-t="${t.id}">${P.confirmDel === t.id ? "Tap again to delete" : "Delete"}</button>`}</div>`;
    }
    h += `</div>`;
  });

  h += `<div class="section"><h2>Your runs</h2></div><div class="card">`;
  const list = (RUNIDX.list || []).slice().reverse();
  list.filter(m => !m.archived || P.showArchived).forEach(m => {
    const R = RUNS[m.id], wk = R ? planWeeks(R.plan).length : 0;
    h += `<div class="dayrow${m.archived ? " off" : ""}" style="grid-template-columns:1fr auto;align-items:center"><div><b>${esc(runLabel(m))}</b>${m.id === RUNIDX.active ? ' <span class="chip">Active</span>' : ""}<div class="rx">${m.started ? `Started ${fmtDate(m.started, true)}` : "No start date"} · ${wk} weeks · ${loggedIn(m.id)} session${loggedIn(m.id) === 1 ? "" : "s"} done</div></div>`
      + `<div class="edbtns" style="grid-column:auto">${m.id !== RUNIDX.active ? `<button class="btn" data-k="plopen" data-r="${m.id}">Open</button>` : ""}${m.id !== RUNIDX.active ? `<button class="btn text" data-k="plarch" data-r="${m.id}">${m.archived ? "Unarchive" : "Archive"}</button>` : ""}</div></div>`;
  });
  if (list.some(m => m.archived)) h += `<button class="addnote" data-k="plshowarch">${P.showArchived ? "Hide archived runs" : "Show archived runs"}</button>`;
  h += `</div>`;
  return h;
}

// write this run's guide, or its whole plan, back into one of your templates
function updatePanel(act, blocks){
  const mine = tplList().filter(t => !t.builtin);
  let h = `<div class="section"><h2>Update a template</h2><p>Changed the guide or the plan in this run? Copy it back into a template so future runs start with it. Runs you've already started don't change.</p></div><div class="card">`;
  if (!mine.length) return h + `<div class="empty">You haven't saved any templates yet. Save one below first. The built-in Hybrid 12 can't be changed.</div></div>`;
  const P = ui.plans, src = tplById(act.tpl), U = P.upd || {tpl: src && !src.builtin ? src.id : mine[mine.length - 1].id, what: "guide", block: String(blocks[0] || 1)};
  P.upd = U;
  const T = tplById(U.tpl) || mine[0];
  h += `<div class="fgrid"><label class="fld wide"><span>Template</span><select id="pu-tpl" data-k="pusel" data-f="tpl">${mine.map(t => `<option value="${t.id}"${t.id === T.id ? " selected" : ""}>${esc(t.name)} (${t.kind === "block" ? "block" : "programme"})${src && t.id === src.id ? " · this run's template" : ""}</option>`).join("")}</select></label></div>`;
  h += `<div class="fld"><span>Update</span><div class="seg" role="group" aria-label="Update">${[["guide", "Programme guide only"], ["all", T.kind === "block" ? "Guide and block" : "Guide and whole programme"]].map(([k, l]) => `<button data-k="puwhat" data-v="${k}" aria-pressed="${U.what === k}">${l}</button>`).join("")}</div></div>`;
  if (U.what === "all" && T.kind === "block") h += `<label class="fld"><span>Block to copy</span><select id="pu-block" data-k="pusel" data-f="block">${blocks.map(b => `<option value="${b}"${String(U.block) === String(b) ? " selected" : ""}>Block ${blockOrd(b)} · ${esc(blockName(b))} (${blockWeeks(b).length} weeks)</option>`).join("")}</select></label>`;
  h += `<div class="hint">${U.what === "guide" ? `Replaces the guide in "${esc(T.name)}" with this run's guide. Its weeks, days and exercises stay as they are.` : `Replaces everything in "${esc(T.name)}" (${T.kind === "block" ? "the block's weeks, days, exercises" : "weeks, blocks, days, exercises"}, warm-ups, intensifiers, benchmarks and guide) with this run's version. Your log isn't copied.`}</div>`;
  h += `<div class="edbtns"><button class="btn${P.updConfirm ? " primary" : ""}" data-k="pugo">${P.updConfirm ? `Tap again to update "${esc(T.name)}"` : `Update "${esc(T.name)}"`}</button>${P.updConfirm ? `<button class="btn" data-k="pucancel">Cancel</button>` : ""}</div></div>`;
  return h;
}
function updateTemplate(U){
  const T = TPLS[U.tpl]; if (!T) return false;
  if (U.what === "guide") { if (S.plan.guide) T.plan.guide = clone(S.plan.guide); else delete T.plan.guide; }
  else if (T.kind === "block") { const sub = blockSubset(+U.block); const keepName = (T.plan.blocks || {}); T.plan = sub; }
  else { const plan = clone(S.plan); delete plan.baseSchedule; if (!Array.isArray(plan.schedule)) plan.schedule = clone(schedAll()); T.plan = plan; }
  T.updated = new Date().toISOString(); T.updatedFrom = RUNIDX.active;
  saveDid("tpl." + T.id); return true;
}

// ---------- backup, import, sharing ----------
async function offerFile(filename, text){
  if (!IS_APP) {
    try { const dl = await window.claude?.use?.("downloads"); if (dl) { await dl.save({filename, data: text}); toast(`Saved ${filename}.`); return; } }
    catch (e) { if (e && e.code === "declined") return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], {type: filename.endsWith(".json") ? "application/json" : "text/plain"}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast(`Downloaded ${filename}.`);
  } catch (e) { toast("Couldn't create the file here.", "err", "Download failed."); }
}
function exportData(kind){
  const base = {app: "training-app", version: 1, exported: new Date().toISOString()};
  if (kind === "templates") return offerFile(`training-templates-${todayISO()}.json`, JSON.stringify(Object.assign(base, {type: "templates", tpls: clone(TPLS)}), null, 1));
  return offerFile(`training-backup-${todayISO()}.json`, JSON.stringify(Object.assign(base, {type: "all", runs: clone(RUNS), idx: clone(RUNIDX), tpls: clone(TPLS)}), null, 1));
}
function readImport(file){
  const r = new FileReader();
  r.onload = () => {
    let P = null; try { P = JSON.parse(r.result); } catch (e) {}
    if (!P || P.app !== "training-app" || (P.type === "all" && !(P.runs && P.idx && Array.isArray(P.idx.list))) || (P.type === "templates" && !P.tpls)) { ui.data = {}; render(); flagError("That file isn't a backup or template file from this app.", ["imp-file"], "Can't import."); return; }
    ui.data = {pending: P, name: file.name}; render();
  };
  r.onerror = () => flagError("Couldn't read that file.", ["imp-file"], "Can't import.");
  r.readAsText(file);
}
function allDids(){ const out = ["runs"]; Object.entries(RUNS).forEach(([r, R]) => { const p = runPrefix(r); out.push(p + "plan", p + "settings", p + "body"); Object.keys(R.sessions).forEach(k => out.push(p + k)); }); Object.keys(TPLS).forEach(k => out.push("tpl." + k)); return out; }
async function pushAll(dids){ cache(); if (mode !== "db") { setStatus(); return; } for (const d of dids) { clearTimeout(timers[d]); delete timers[d]; await flush(d); } }
function addTemplates(tpls){
  let n = 0;
  Object.values(tpls || {}).forEach(t => { if (!t || !t.plan) return; let id = t.id || ("t" + Date.now().toString(36) + n); if (TPLS[id] && JSON.stringify(TPLS[id]) === JSON.stringify(t)) return; if (TPLS[id]) id = "t" + Date.now().toString(36) + n; TPLS[id] = Object.assign({}, t, {id, imported: new Date().toISOString()}); saveDid("tpl." + id); n++; });
  return n;
}
function replaceAll(P){
  const old = allDids();
  RUNS = clone(P.runs); RUNIDX = clone(P.idx); TPLS = clone(P.tpls || {});
  Object.values(RUNS).forEach(R => { R.sessions = R.sessions || {}; R.settings = R.settings || {e1rm: {}, round: 2.5}; R.body = R.body || {bw: {}, bench: {}}; R.plan = R.plan || {edits: []}; normalizePlan(R.plan); });
  if (!RUNS[RUNIDX.active]) RUNIDX.active = Object.keys(RUNS)[0] || "main";
  if (!RUNS[RUNIDX.active]) RUNS[RUNIDX.active] = blankRun();
  S = RUNS[RUNIDX.active]; planVer++; EFF.clear(); closePanels();
  const v = schedVis(); ui.w = v.length ? v[0].id : 1; const dl = daysFor(ui.w); ui.d = dl.length ? dl[0].key : "mon";
  const now = allDids();
  pushAll(now).then(() => { if (mode === "db") old.filter(d => !now.includes(d)).forEach(deleteDid); setStatus(); });
}

  h += `<div class="card"><h3 style="margin:0;font-size:16px">Export</h3><div class="rx">${nRuns} run${nRuns === 1 ? "" : "s"} · ${sessionsDone} session${sessionsDone === 1 ? "" : "s"} done · ${nT} saved template${nT === 1 ? "" : "s"}</div>`
    + `<div class="edbtns"><button class="btn primary" data-k="expall">Download full backup</button><button class="btn" data-k="exptpl"${nT ? "" : " disabled"}>Download templates only</button></div>`
    + `<div class="hint">A full backup has every run, its log, maxes and plan, plus your templates. "Templates only" is for sharing a programme: the other person imports it and starts their own run.</div></div>`;
  h += `<div class="card"><h3 style="margin:0;font-size:16px">Import</h3><label class="fld"><span>Backup or template file (.json)</span><input type="file" id="imp-file" accept=".json,application/json"></label>`;
  if (D.pending) {
    const P = D.pending, isAll = P.type === "all", pt = Object.keys(P.tpls || {}).length;
    h += `<div class="wform"><div><b>${esc(D.name || "File")}</b></div><div class="rx">${isAll ? `Full backup · ${(P.idx.list || []).length} run(s) · ${pt} template(s)` : `${pt} template(s)`}${P.exported ? ` · exported ${fmtDate(P.exported.slice(0, 10), true)}` : ""}</div>`
      + `<div class="edbtns">${isAll ? `<button class="btn${D.confirm ? " primary" : ""}" data-k="impreplace">${D.confirm ? "Tap again: replace everything" : "Replace all my data with this"}</button>` : ""}${pt ? `<button class="btn" data-k="imptpl">Add its templates to my library</button>` : ""}<button class="btn text" data-k="impcancel">Cancel</button></div>`
      + (isAll ? `<div class="hint">Replacing swaps every run, log and template ${IS_APP ? "on this device" : "in your account"} for the ones in the file. Download a backup first if you might want them back.</div>` : "") + `</div>`;
  }

function viewHelp(){

  h += sec("Changing exercises", `<p>Tap <span class="k">Edit exercise</span> on any card to swap the exercise, change its label, sets, reps, effort, rest, weight, coaching note or intensifier, or remove it from the day.</p><p>Every change asks how far it should reach: this week, the rest of the block, or every remaining week. Extra sets scale down in lighter weeks, and intensifiers skip them. <span class="k">Back to plan</span> undoes a change.</p><p>Main lifts keep feeding Progress whatever variation you swap in. <span class="k">Reorder</span> at the bottom of a day moves cards up and down.</p>`);
  h += sec("Warm-ups, benchmark tests and intensifiers", `<p><span class="k">Change warm-up</span> picks a built-in warm-up, one you've written, or none. Edit a warm-up and it changes everywhere it's used.</p><p>Benchmark test cards work the same way: <span class="k">Change test</span> swaps or edits the test and sets whether it counts as your start or end result. <span class="k">Add benchmark test</span> puts a new one on any day. Results you type there appear on Progress.</p><p>Intensifiers (drop sets, myo-reps, cluster sets and more) are picked in an exercise's editor. Edit or add your own in the Programme guide.</p>`);

  h += sec("Programmes, templates and runs", `<p>Open <span class="k">Programmes &amp; runs</span> from the menu.</p><ul><li><span class="k">Save as a template:</span> keep the whole programme, or one block, with all your changes.</li><li><span class="k">Start a run:</span> begin any template again with its own log, maxes, progress and dates. Runs are numbered and dated, so repeats never mix.</li><li><span class="k">Add to this run:</span> put a saved block into the programme you're on.</li><li><span class="k">Share a programme:</span> Backup &amp; data → Download templates only. The other person imports the file and starts their own run.</li><li><span class="k">Update a template:</span> copy this run's guide, or its whole plan, back into one of your templates so future runs start with it.</li><li><span class="k">Your runs:</span> open or archive any run.</li></ul>`);
  h += sec("Progress and maxes", `<p>Progress charts your best estimated max for each main lift every week, plus bodyweight. Tap a week on a chart for its numbers.</p><p><span class="k">Edit benchmarks</span> renames, reorders, removes or adds tests. Link one to an exercise and it fills in from your log.</p><p>Maxes drive every suggested weight. Each block uses the previous block's max until you enter a new one. At the start of a block, put in your best e1RM from Progress, rounded down.</p>`);

}

let dbChecked = false;
async function connect(){
  try {
    const [d, u] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    if (d && u) { uid = await u.id(); if (uid) { db = d; } }
  } catch(e) {}
  dbChecked = true;
  if (!db) { mode = "local"; setStatus(); render(); return; }
  mode = "db"; setStatus();
  let first = true;
  db.collection("data/users/" + uid).onSnapshot(snap => {
    let changed = false;
    const seen = new Set();
    snap.docs.forEach(doc => {
      const did = doc.id; seen.add(did);
      if (timers[did] || inflight[did] || doc.metadata.hasPendingWrites) return;
      const data = JSON.parse(JSON.stringify(doc.data() || {}));
      const [r, k] = parseDid(did);
      if (r === "runs") { if (Array.isArray(data.list) && JSON.stringify(RUNIDX) !== JSON.stringify(data)) { const was = RUNIDX.active; RUNIDX = data; if (!RUNS[RUNIDX.active]) RUNS[RUNIDX.active] = blankRun(); if (RUNIDX.active !== was) { S = RUNS[RUNIDX.active]; planVer++; EFF.clear(); } changed = true; } return; }
      if (r === "tpl") { if (JSON.stringify(TPLS[k]) !== JSON.stringify(data)) { TPLS[k] = data; changed = true; } return; }
      const R = RUNS[r] || (RUNS[r] = blankRun());
      if (k === "settings") { if (JSON.stringify(R.settings) !== JSON.stringify(data)) { R.settings = Object.assign({e1rm:{}, round:2.5}, data); changed = true; } }
      else if (k === "plan") { if (JSON.stringify(R.plan) !== JSON.stringify(data)) { R.plan = Object.assign({edits:[]}, data); if (normalizePlan(R.plan)) saveDid(did); if (R === S) { planVer++; EFF.clear(); } changed = true; } }
      else if (k === "body") { if (JSON.stringify(R.body) !== JSON.stringify(data)) { R.body = Object.assign({bw:{}, bench:{}}, data); changed = true; } }
      else if (/^w\d+-\w+$/.test(k)) { if (JSON.stringify(R.sessions[k]) !== JSON.stringify(data)) { R.sessions[k] = Object.assign({sets:{}, notes:{}, results:{}, note:"", done:false}, data); changed = true; } }
    });
    if (!snap.metadata.fromCache) {
      if (first) {
        first = false;
        // anything saved on this device before the store was reachable gets uploaded once
        Object.entries(RUNS).forEach(([rid, R]) => {
          const pre = runPrefix(rid);
          Object.keys(R.sessions).forEach(id => { if (!seen.has(pre + id) && hasData(R.sessions[id])) saveDid(pre + id); });
          if (!seen.has(pre + "settings") && (Object.keys(R.settings.e1rm||{}).length || rid !== "main")) saveDid(pre + "settings");
          if (!seen.has(pre + "plan") && (JSON.stringify(R.plan) !== JSON.stringify({edits:[]}) || rid !== "main")) saveDid(pre + "plan");
          if (!seen.has(pre + "body") && (Object.keys(R.body.bw||{}).length || Object.keys(R.body.bench||{}).length || rid !== "main")) saveDid(pre + "body");
        });
        if (!seen.has("runs") && (RUNIDX.list.length > 1 || RUNIDX.list.some(x => x.name || x.started))) saveDid("runs");
        Object.keys(TPLS).forEach(k => { if (!seen.has("tpl." + k)) saveDid("tpl." + k); });
      } else {
        // templates deleted on another device go here too
        Object.keys(TPLS).forEach(k => { const did = "tpl." + k; if (!seen.has(did) && !timers[did] && !inflight[did]) { delete TPLS[k]; changed = true; } });
      }
    }
    if (changed) { cache(); const a = document.activeElement; if (!(a && a.dataset && a.dataset.k)) render(); }
    setStatus();
  }, err => { mode = "local"; errMsg = ""; setStatus(); render(); });
}
